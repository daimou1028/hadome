<!doctype html>
<html lang="__LOCALE__">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'unsafe-inline' __CSP_SOURCE__; script-src 'unsafe-inline' __CSP_SOURCE__; font-src __CSP_SOURCE__; img-src data:;" />
    <meta name="locale" content="__LOCALE__" />
    <title>ChatGPT Bridge</title>

    <link rel="stylesheet" href="__CODICON__" />
    <style>
      :root {

        --icon: 16px;

        --sp-foot: 5px;

        --sp-foot-gap: 2px;

        --role-tool-bg: var(--vscode-editor-background); color-scheme: light dark; }

      :root {

        --role-done: var(--vscode-gitDecoration-addedResourceForeground, var(--vscode-charts-green, #89d185));
        --role-failed: var(--vscode-errorForeground);
        --role-again: var(--vscode-editorWarning-foreground, #cca700);

        --role-pending: var(--vscode-charts-purple, #b180d7);

        --role-running: var(--vscode-charts-blue, #3794ff);

        --role-stopped: var(--vscode-editorWarning-foreground, #cca700);
        --role-asked: var(--vscode-charts-blue, #3794ff);

        --role-focus: var(--vscode-focusBorder, rgba(57, 148, 188, 0.7));

        --role-picked: rgba(127, 127, 127, 0.18);
        --role-hover: rgba(127, 127, 127, 0.12);

        --role-mode-ask: var(--vscode-foreground, #bfbfbf);
        --role-mode-plan: var(--vscode-foreground, #bfbfbf);
        --role-mode-edit: var(--vscode-foreground, #bfbfbf);
        --role-mode-never: var(--vscode-errorForeground, #ff827d);
        --role-sub-1: var(--vscode-charts-blue, #3794ff);
        --role-sub-2: var(--vscode-charts-purple, #b180d7);
        --role-sub-3: var(--vscode-charts-orange, #d18616);
        --role-sub-4: var(--vscode-charts-yellow, #cca700);

        --role-diff-added: var(--vscode-diffEditor-insertedTextBackground, rgba(155, 185, 85, 0.2));
        --role-diff-removed: var(--vscode-diffEditor-removedTextBackground, rgba(255, 0, 0, 0.2));

        --role-border: var(--vscode-panel-border);
        --role-quote-bg: var(--vscode-textBlockQuote-background);
        --role-quote-border: var(--vscode-textBlockQuote-border, var(--role-border));
        --role-code-bg: var(--vscode-textCodeBlock-background);
        --role-focus: var(--vscode-focusBorder);
        --role-link: var(--vscode-textLink-foreground);

        --base: max(14px, var(--vscode-font-size, 14px));
        --text-lg: calc(var(--base) * 1.15);
        --text-md: var(--base);

        --text-sm: var(--base);
        --text-xs: var(--base);

        --sp-1: 2px;
        --sp-2: 4px;
        --sp-3: 8px;
        --sp-4: 12px;
        --sp-5: 16px;

        --radius: 4px;

        --role-primary-fg: var(--vscode-foreground);
        --role-secondary-fg: var(--vscode-descriptionForeground, #bfbfbf);
        --role-primary-bg: var(--vscode-sideBar-background, var(--role-secondary-bg));
        --role-secondary-bg: var(--vscode-editor-background);
        --role-modal-bg: var(--vscode-editorWidget-background, var(--role-secondary-bg));
        --role-accent: var(--vscode-symbolIcon-functionForeground);

        --role-input-fg: var(--vscode-input-foreground);
        --role-input-bg: var(--vscode-input-background);
        --role-input-border: var(--vscode-input-border, var(--role-border));

        --role-button-fg: var(--vscode-button-foreground);
        --role-button-bg: var(--vscode-button-background);
        --role-button-hover-bg: var(--vscode-button-hoverBackground, var(--role-button-bg));
        --role-ghost-hover-bg: var(--vscode-toolbar-hoverBackground, rgba(128, 128, 128, 0.2));

        --role-menu-fg: var(--vscode-menu-foreground, var(--role-primary-fg));
        --role-menu-bg: var(--vscode-menu-background, var(--role-modal-bg));
        --role-menu-border: var(--vscode-menu-border, var(--role-border));
        --role-menu-selection-bg: var(--vscode-menu-selectionBackground, var(--role-hover));

        --role-list-hover-bg: var(--vscode-list-hoverBackground);
        --role-list-active-fg: var(--vscode-list-activeSelectionForeground);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;

        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        font-family: var(--vscode-font-family);

        font-size: var(--text-md);
        color: var(--role-primary-fg);
        background: var(--role-primary-bg);
      }

      #head {
        padding: var(--sp-2) var(--sp-4);
        border-bottom: 1px solid var(--role-border);
        font-size: var(--text-sm);
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        min-height: 26px;
      }
      #where { opacity: 0.65; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      #state {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        padding: 0 var(--sp-2) var(--sp-2);
        font-size: var(--text-sm);
        opacity: 0.9;
        white-space: nowrap;
        overflow: hidden;
      }
      #state:empty { display: none; }
      #state .verb { flex: 0 0 auto; }

      #state .what { overflow: hidden; text-overflow: ellipsis; opacity: 0.7; font-size: var(--text-xs); }

      #state .meta { opacity: 0.6; font-size: var(--text-xs); flex: 0 0 auto; }

      #model { opacity: 0.5; font-size: var(--text-xs); white-space: nowrap; margin-left: var(--sp-2); }

      .took { opacity: 0.45; font-size: var(--text-xs); margin-left: var(--sp-2); }
      .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--role-running);
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { opacity: 0.3 } 50% { opacity: 1 } }

      .dot.ok, .dot.ng { animation: none; opacity: 1; }
      .dot.ok { background: var(--role-done); }
      .dot.ng { background: var(--role-failed); }

      #log { flex: 1; overflow-y: auto; padding: var(--sp-4) var(--sp-4); }

      #empty { color: var(--role-secondary-fg); font-size: var(--text-md); line-height: 1.7; padding: var(--sp-3) var(--sp-1); }

      .msg { margin-bottom: var(--sp-4); }
      .who {
        font-size: var(--text-xs);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.55;
        margin-bottom: var(--sp-2);
      }
      .body { line-height: 1.6; word-break: break-word; }
      .you .body {
        background: var(--role-quote-bg);
        border-left: 2px solid var(--role-link);
        padding: var(--sp-3) var(--sp-4);
        border-radius: 0 4px 4px 0;
        white-space: pre-wrap;
      }

      .body p { margin: 0 0 0.7em; }
      .body p:last-child { margin-bottom: 0; }
      .body ul { margin: 0 0 0.7em; padding-left: 1.3em; }

      .body ol { margin: 0 0 0.7em; padding-left: 1.3em; }
      .body table {
        display: block;
        max-width: 100%;
        overflow-x: auto;
        margin: 0.5em 0 0.7em;
        border-collapse: collapse;
      }
      .body th,
      .body td {
        border: 1px solid var(--role-border);
        padding: var(--sp-2) var(--sp-3);
        text-align: left;
        vertical-align: top;

        word-break: normal;
      }
      .body blockquote {
        margin: 0.5em 0;
        padding: var(--sp-3) var(--sp-4);
        background: var(--role-quote-bg);
        border-left: 2px solid var(--role-quote-border);
        border-radius: 0 var(--radius) var(--radius) 0;
      }
      .body hr { border: none; border-top: 1px solid var(--role-border); margin: 0.9em 0; }
      .body h3 { font-size: var(--text-md); margin: 0.9em 0 0.4em; }
      .body code {
        font-family: var(--vscode-editor-font-family);
        font-size: var(--text-sm);
        background: var(--role-code-bg);
        padding: var(--sp-1) var(--sp-2);
        border-radius: var(--radius);
      }
      .body pre {
        margin: 0.5em 0;
        padding: var(--sp-3) var(--sp-4);
        overflow-x: auto;
        background: var(--role-code-bg);
        border-radius: var(--radius);
      }
      .body pre code { background: none; padding: 0; }

      pre { position: relative; }

      .changes { margin: var(--sp-2) 0; font-size: var(--text-sm); }
      .chghead {
        display: flex; align-items: center; gap: var(--sp-1);
        width: 100%; background: none; border: 0; padding: var(--sp-1) 0;
        color: var(--role-secondary-fg); cursor: pointer; text-align: left;
      }
      .chghead:hover { color: var(--role-primary-fg); }
      .chghead .nm { flex: 1 1 auto; }
      .chghead .cnt { flex: 0 0 auto; opacity: 0.7; }
      .chglist { display: flex; flex-direction: column; padding-left: var(--sp-4); }
      .chgitem {
        display: flex; align-items: baseline; gap: var(--sp-1);
        background: none; border: 0; padding: 1px 0; cursor: pointer;
        color: var(--role-secondary-fg); text-align: left;
      }
      .chgitem:hover { color: var(--vscode-textLink-activeForeground, inherit); text-decoration: underline; }

      .chgitem .p { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .chgitem .n { flex: 0 0 auto; opacity: 0.6; }
      code.openable { cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }
      code.openable:hover { text-decoration-style: solid; color: var(--vscode-textLink-activeForeground, inherit); }
      .cbacts { display: flex; gap: var(--sp-1); justify-content: flex-end; margin-top: var(--sp-1); opacity: 0.55; }
      pre:hover .cbacts { opacity: 1; }
      .cbact {
        font: inherit; font-size: var(--text-xs); padding: 0 var(--sp-1);
        color: var(--role-primary-fg); background: transparent;
        border: 1px solid var(--role-border); border-radius: 3px; cursor: pointer;
      }
      .cbact:hover { background: var(--role-list-hover-bg); }
      body.focus .toolbox { display: none; }
      .toolbox { margin-bottom: var(--sp-1); overflow-wrap: anywhere; }

      .toolrun { margin-bottom: var(--sp-1); }
      .toolrun > .runhead {
        display: flex; gap: var(--sp-2); align-items: baseline;
        padding: var(--sp-1) var(--sp-2);
        cursor: pointer; border-radius: var(--radius);
        color: var(--role-secondary-fg);
      }
      .toolrun > .runhead:hover { background: var(--role-list-hover-bg); }
      .toolrun > .runhead .n { color: var(--role-primary-fg); }
      .toolrun > .runhead .tgts {
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto;
      }

      .toolrun:not(.open) > .runbody { display: none; }
      .toolrun > .runbody { padding-left: var(--sp-3); }

      .toolrun.bad > .runbody { display: block; }
      .toolbox .head { cursor: pointer; }
      .toolbox .head:hover { background: var(--role-list-hover-bg); }

      .toolbox .bodywrap {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 120ms ease;
      }
      .toolbox.open .bodywrap { grid-template-rows: 1fr; }
      .toolbox .bodywrap > pre {
        overflow: hidden;
        margin: 0;
        font-size: var(--text-sm);
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .toolbox.open .bodywrap > pre {
        overflow-x: auto;
        margin: var(--sp-1) 0 var(--sp-2);
        padding: var(--sp-3) var(--sp-4) var(--sp-3) calc(var(--sp-5) + var(--sp-1));
        background: var(--role-code-bg);
        border-left: 2px solid var(--role-border);
      }
      .toolbox .caret { flex: 0 0 auto; opacity: 0.5; width: 9px; }

      .tool > * { min-width: 0; }
      .tool {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        overflow-wrap: anywhere;
        min-width: 0;
        gap: 2px;
        font-family: var(--vscode-editor-font-family);
        font-size: var(--text-sm);
        padding: var(--sp-2) var(--sp-3);
        margin-bottom: var(--sp-2);
        border: 1px solid var(--role-border);
        border-radius: 5px;
        background: var(--role-tool-bg);
        opacity: 0.9;
      }

      .tool.bad { border-color: var(--role-failed); opacity: 1; }

      .tool.again { border-color: var(--role-again); opacity: 1; }

      .tool .toolhead {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        min-width: 0;
      }

      .tool .tgt {
        min-width: 0;
        flex: 1 1 auto;
        overflow-wrap: anywhere;
      }

      .tool .toolmeta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;

        padding-left: calc(var(--sp-5) + var(--sp-3));
        font-size: var(--text-xs);
      }
      .tool .toolmeta > * { flex: 0 0 auto; }
      .tool .mark { flex: 0 0 auto; opacity: 0.7; }
      .tool .caret { flex: 0 0 auto; }
      .tool .name { flex: 0 0 auto; }
      .tool.bad .mark { color: var(--role-failed); opacity: 1; }
      .tool.again .mark { color: var(--role-again); opacity: 1; }
      .tool .name { color: var(--role-accent); }

      .tool .why { opacity: 0.75; min-width: 0; flex: 1 1 auto; overflow-wrap: anywhere; }

      .tool .difflink {
        padding-left: var(--sp-3);
        color: var(--role-link);
        cursor: pointer;
        text-decoration: none;
        flex: 0 0 auto;
      }
      .tool .difflink:hover { text-decoration: underline; }

      .shot { margin: var(--sp-3) 0 var(--sp-4); }
      .shot img {
        max-width: 100%;
        height: auto;
        border-radius: var(--radius);
        border: 1px solid var(--role-border);
        display: block;
      }
      .shot .cap { font-size: var(--text-xs); opacity: 0.55; margin-top: var(--sp-1); }

      .note {
        font-size: var(--text-sm); opacity: 0.55;
        padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-3);
        overflow-wrap: anywhere;
      }

      .ask {
        margin: var(--sp-3) 0 var(--sp-4);
        padding: var(--sp-4) var(--sp-4);
        border-radius: var(--radius);
        background: var(--role-quote-bg);
        border-left: 2px solid var(--role-again);
        font-size: var(--text-md);
        line-height: 1.6;
      }

      .ask .what {
        margin: var(--sp-3) 0 var(--sp-1);
        padding: var(--sp-3) var(--sp-4);
        border-radius: var(--radius);
        background: var(--role-code-bg);
        border: 1px solid var(--role-border);
        font-family: var(--vscode-editor-font-family, monospace);
        font-size: var(--text-sm);
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
      }

      .cmdout {
        margin: var(--sp-2) 0;
        padding: var(--sp-2) var(--sp-3);
        border-left: 2px solid var(--role-running);
        background: var(--role-code-bg);
        border-radius: var(--radius);
      }
      .cmdout .cmdhead {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        font-family: var(--vscode-editor-font-family, monospace);
        font-size: var(--text-xs);
        opacity: 0.8;
        margin-bottom: var(--sp-1);
      }
      .cmdout .cmdhead .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .cmdout .cmdhead .sec { margin-left: auto; opacity: 0.7; flex: 0 0 auto; }
      .cmdout pre[hidden] { display: none; }
      .cmdout pre {
        margin: 0;
        max-height: 160px;
        overflow-y: auto;
        font-size: var(--text-xs);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .subrow {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        padding: var(--sp-1) var(--sp-2);
        margin-bottom: var(--sp-1);
        font-size: var(--text-sm);
      }
      .subrow .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex: 0 0 auto;
      }
      .subrow .dot.sub-1 { background: var(--role-sub-1); }
      .subrow .dot.sub-2 { background: var(--role-sub-2); }
      .subrow .dot.sub-3 { background: var(--role-sub-3); }
      .subrow .dot.sub-4 { background: var(--role-sub-4); }
      .subrow .nm { opacity: 0.85; }
      .subrow .st { opacity: 0.7; }
      .subrow .meta { opacity: 0.5; font-size: var(--text-xs); }

      .toolbox .more {
        margin-top: var(--sp-2);
        padding: var(--sp-1) var(--sp-2);
        color: var(--role-link);
        cursor: pointer;
        font-size: var(--text-xs);
        opacity: 0.85;
      }
      .toolbox .more:hover { opacity: 1; text-decoration: underline; }

      .result {
        margin: var(--sp-3) 0 var(--sp-4);
        padding: var(--sp-4) var(--sp-4);
        border-radius: var(--radius);
        background: var(--role-quote-bg);
        border-left: 2px solid var(--role-done);
        line-height: 1.6;
      }
      .result.bad { border-left-color: var(--role-again); }
      .result .cap { font-size: var(--text-xs); opacity: 0.6; margin-bottom: var(--sp-2); }

      .actions { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-3); }

      .ask .chosen {
        margin-top: var(--sp-3);
        font-size: var(--text-sm);
        opacity: 0.78;
      }
      .ask .chosen::before { content: '✓ '; color: var(--role-done); }

      #bar { border-top: 1px solid var(--role-border); padding: var(--sp-4); flex: 0 0 auto; }
      @media screen and (max-width: 300px) {

        #log { padding: var(--sp-1) var(--sp-1); }
        #bar { padding: var(--sp-1); }

        #tools { padding: var(--sp-foot-gap); }

        #tools .iconbtn { width: 24px; min-width: 24px; height: 24px; }
        #mode.iconbtn { width: 24px; }
      }

      #log.landing { display: flex; align-items: center; justify-content: center; }
      #log.landing #empty { text-align: center; max-width: 340px; }

      #empty .lead { font-size: var(--text-lg); color: var(--role-primary-fg); font-weight: 600; margin-bottom: var(--sp-3); }

      #chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 var(--sp-2) var(--sp-2); }
      #chips[hidden] { display: none; }
      #chips .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        max-width: 100%;
        padding: var(--sp-1) var(--sp-2) var(--sp-1) var(--sp-3);
        border-radius: 10px;
        font-size: var(--text-xs);
        background: var(--vscode-badge-background);
        color: var(--vscode-badge-foreground);
      }
      #chips .chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      #chips .chip.gone .nm { text-decoration: line-through; opacity: 0.55; }
      #chips .chip.gone { border-color: var(--role-failed, var(--role-border)); }
      #chips .chip .x { cursor: pointer; opacity: 0.6; padding: 0 var(--sp-1); }
      #chips .chip .x:hover { opacity: 1; }

      #queue { margin-bottom: var(--sp-3); max-height: 190px; overflow-y: auto; }
      #queue[hidden] { display: none; }
      #queue .qhead {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        font-size: var(--text-xs);
        opacity: 0.6;
        margin-bottom: var(--sp-2);
      }
      #queue .qclear { cursor: pointer; text-decoration: underline; }
      #queue .qrow {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        padding: var(--sp-2) var(--sp-3);
        margin-bottom: var(--sp-1);
        border-radius: var(--radius);
        border-left: 2px solid var(--role-border);
        background: var(--role-quote-bg);
        font-size: var(--text-sm);
      }
      #queue .qrow:hover { border-left-color: var(--role-link); }
      #queue .qtext {
        flex: 1 1 auto;
        min-width: 0;
        white-space: pre-wrap;
        word-break: break-word;
        cursor: text;
      }
      #queue textarea.qedit {
        flex: 1 1 auto;
        min-width: 0;
        font: inherit;
        color: var(--role-input-fg);
        background: var(--role-input-bg);
        border: 1px solid var(--role-focus);
        border-radius: var(--radius);
        padding: var(--sp-1) var(--sp-2);
        resize: none;
      }
      #queue .qx {
        flex: 0 0 auto;
        cursor: pointer;
        opacity: 0.5;
        padding: 0 var(--sp-1);
        line-height: 1.4;
      }
      #queue .qx:hover { opacity: 1; color: var(--role-failed); }
      #inwrap {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--role-input-border);

        border-radius: 8px;
        background: var(--role-input-bg);
      }
      #inwrap:focus-within { border-color: var(--role-focus); }
      #inwrap { position: relative; }

      #inwrap.dropping {
        border-style: dashed;
        border-color: var(--role-focus);
        background: color-mix(in srgb, var(--role-input-bg) 92%, var(--role-focus));
      }
      textarea {
        border: none;
        outline: none;
        resize: none;

        min-height: calc(1.5em * 3 + var(--sp-3) + var(--sp-2));
        max-height: 200px;
        padding: var(--sp-3) var(--sp-3) var(--sp-2);
        font-family: inherit;
        font-size: inherit;
        line-height: 1.5;
        color: var(--role-input-fg);
        background: transparent;
      }

      #inwrap:focus-within {
        border-color: var(--role-focus);
      }

      #tools {
        border-top: 1px solid var(--role-input-border);
        padding: var(--sp-foot);
        display: flex;

        flex-wrap: wrap;
        align-items: center;
        gap: var(--sp-foot-gap);
      }

      #tools #gap { flex: 1 1 0; min-width: 0; }

      #tools #modewrap { flex: 0 1 auto; min-width: 0; }
      #tools #enterkey { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

      #tools #mode { max-width: 100%; }
      #tools #mode .nm { overflow: hidden; text-overflow: ellipsis; }

      .statetext {
        appearance: none;
        background: none;
        border: none;
        padding: var(--sp-1) var(--sp-2);
        color: var(--role-secondary-fg);
        font-family: inherit;
        font-size: var(--text-sm);
        white-space: nowrap;
        cursor: pointer;
      }
      #enterkey:hover,
      #enterkey:focus-visible {
        color: var(--role-primary-fg);
        outline: none;
      }

      .mode {
        appearance: none;
        background: none;
        border: none;
        border-radius: var(--radius);
        padding: var(--sp-1) var(--sp-2);
        color: var(--role-secondary-fg);

        opacity: 0.75;
        cursor: pointer;
        font-family: inherit;
        font-size: var(--text-sm);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 200px;
        min-width: 0;

        overflow: hidden;
      }

      #modewrap { position: relative; display: flex; align-items: center; min-width: 0; }

      .modesize { display: grid; }
      .modesize > * { grid-area: 1 / 1; white-space: nowrap; }
      .modesize .ghost { visibility: hidden; pointer-events: none; }
      .modesize .real { display: inline-flex; align-items: center; }

      .modepick {
        position: absolute;
        left: 0;
        bottom: 100%;
        margin-bottom: var(--sp-2);
        display: flex;
        flex-direction: column;

        min-width: 260px;
        max-width: min(420px, calc(100vw - var(--sp-5) * 2));
        padding: var(--sp-1);
        border: 1px solid var(--role-border);
        border-radius: var(--radius);
        background: var(--role-modal-bg);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        z-index: 20;
      }
      .modeitem {
        appearance: none;
        background: none;
        border: none;
        border-radius: var(--radius);
        padding: var(--sp-1) var(--sp-2);
        text-align: left;
        white-space: nowrap;
        cursor: pointer;
        font-family: inherit;
        font-size: var(--text-sm);
        display: flex;
        gap: var(--sp-2);
      }

      .modeitem { color: var(--role-primary-fg); }

      .modeitem:hover,
      .modeitem:focus-visible {
        background: var(--role-hover);
        color: var(--role-primary-fg);
      }
      .modeitem:hover .mark,
      .modeitem:focus-visible .mark { color: var(--role-primary-fg); }
      .modeitem:hover .note,
      .modeitem:focus-visible .note {
        color: var(--role-primary-fg);
        opacity: 0.85;
      }

      .modeitem.now {
        background: var(--role-picked);
      }
      .modeitem.now .note { color: var(--role-primary-fg); opacity: 0.8; }

      .modeitem .mark { display: inline-block; min-width: 1.6em; }

      #picks .pick .mark { margin-right: var(--sp-2); opacity: 0.7; }

      .modeitem .col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

      .ask .actions:has(.col) { flex-direction: column; align-items: stretch; gap: var(--sp-2); }
      .ask .actions button:has(.col) {
        display: block;
        width: 100%;
        text-align: left;
        padding: var(--sp-3);
      }
      .ask .actions button .col { display: flex; flex-direction: column; gap: var(--sp-1); align-items: flex-start; text-align: left; }
      .ask .actions button .nm { font-weight: 600; }
      .ask .actions button .note { opacity: 0.8; font-size: var(--text-sm); white-space: normal; line-height: 1.5; }
      .modeitem .note {
        opacity: 0.7;
        color: var(--role-secondary-fg);
        white-space: normal;
        line-height: 1.5;
      }

      .modeitem { white-space: normal; align-items: flex-start; }

      .modeitem .mark { margin-top: var(--sp-1); }

      .mode .mark { margin-right: var(--sp-2); width: 1em; flex: 0 0 auto; }
      .modesize .ghost .mark { display: inline-block; }

      #gearwrap { position: relative; display: inline-flex; flex: 0 0 auto; }
      .gearpick {
        position: absolute;
        bottom: calc(100% + var(--sp-2));
        right: 0;
        z-index: 20;
        min-width: 220px;
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: var(--sp-1);
        border: 1px solid var(--role-menu-border);
        border-radius: var(--radius);
        background: var(--role-menu-bg);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      }
      .gearitem {
        appearance: none;
        border: none;
        background: none;
        color: var(--role-menu-fg);
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        padding: var(--sp-2) var(--sp-3);
        border-radius: var(--radius);
        cursor: pointer;
        font-family: inherit;
        font-size: var(--text-sm);
        text-align: left;
        white-space: nowrap;
      }
      .gearitem:hover { background: var(--role-menu-selection-bg); }

      .gearitem .mark { opacity: 0; }
      .gearitem.now .mark { opacity: 1; }

      #mode.iconbtn {
        width: auto;
        min-width: 26px;
        gap: var(--sp-2);
        padding: 0 var(--sp-2) 0 var(--sp-1);
        font-size: var(--text-sm);
      }
      #tools #mode .nm {

        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #tools #mode .mark { flex: 0 0 auto; }

      @media screen and (max-width: 300px) {
        #tools #mode .nm { display: none; }
        #mode.iconbtn { width: 26px; padding: 0; }
      }

      #todobar { flex: 0 0 auto; }
      #todobar:not(.has-todos) { display: none; }

      #todobar .todos { margin: 0 var(--space-3) var(--space-2); }

      .todos {
        border: 1px solid var(--role-border);
        border-radius: 5px;
        background: var(--role-tool-bg);
        padding: var(--sp-2) var(--sp-3);
        margin-bottom: var(--sp-2);
        font-size: var(--text-sm);
      }
      .todohead {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        margin-bottom: var(--sp-2);
        opacity: 0.6;
        font-size: var(--text-xs);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .todohead .cnt { margin-left: auto; font-variant-numeric: tabular-nums; }
      .todo {
        display: flex;
        align-items: flex-start;
        gap: var(--sp-2);
        padding: 1px 0;
        line-height: 1.5;
      }
      .todo .mark { flex: 0 0 auto; font-size: var(--text-sm); line-height: 1.5; }
      .todo .txt { min-width: 0; word-break: break-word; }

      .todo.completed { opacity: 0.5; }
      .todo.completed .mark { color: var(--role-done); }

      .todo.in_progress { opacity: 1; }
      .todo.in_progress .mark { color: var(--role-running); }
      .todo.pending { opacity: 0.75; }

      #addctx {
        position: absolute;
        top: var(--sp-2);
        right: var(--sp-2);
        z-index: 3;
      }

      #input { padding-right: calc(26px + var(--sp-3)); }

      .iconbtn {
        appearance: none;
        border: none;
        background: none;
        color: var(--role-secondary-fg);
        width: 26px;
        height: 26px;
        min-width: 26px;
        border-radius: 5px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: var(--icon);
        line-height: 1;
        flex: 0 0 auto;
        user-select: none;
      }

      #tools .iconbtn:hover:not(:disabled) {
        background: var(--role-ghost-hover-bg);
        color: var(--role-primary-fg);
      }

      #tools .iconbtn:disabled { cursor: default; opacity: 0.4; }
      #tools .iconbtn:disabled:hover { background: none; color: var(--role-secondary-fg); }

      #tools #send.iconbtn {
        background: var(--role-button-bg);
        color: var(--role-button-fg);
      }
      #tools #send.iconbtn:hover:not(:disabled) {
        background: var(--role-button-hover-bg);
        color: var(--role-button-fg);
      }

      #tools #stop.iconbtn:not(:disabled) { color: var(--role-failed); }

      #mode.mode-ask { color: var(--role-mode-ask); }
      #mode.mode-plan { color: var(--role-mode-plan); }
      #mode.mode-edit { color: var(--role-mode-edit); }
      #mode.mode-never { color: var(--role-mode-never); }

      .mode,
      #enterkey,
      .txtbtn,
      .modeitem {
        user-select: none;
        -webkit-user-select: none;
      }

      #mode:hover,
      #mode:focus-visible,
      #enterkey:hover,
      #enterkey:focus-visible {
        opacity: 1;
        background: none;
        outline: none;
      }

      #picks {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 100%;
        margin-bottom: var(--sp-2);
        max-height: 210px;
        overflow-y: auto;
        border: 1px solid var(--role-focus);
        border-radius: 5px;
        background: var(--vscode-dropdown-background, var(--role-input-bg));
        z-index: 5;
      }
      #picks[hidden] { display: none; }

      #picks .pick {
        display: flex;
        gap: 6px;
        align-items: baseline;
        padding: var(--sp-2) var(--sp-3);
        cursor: pointer;
      }
      #picks .pick .base { flex: 0 0 auto; }
      #picks .pick .dir {
        flex: 1 1 auto;
        min-width: 0;
        opacity: 0.65;
        font-size: var(--text-xs);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #picks .pick.on {
        background: var(--vscode-list-activeSelectionBackground);
        color: var(--role-list-active-fg);
      }
      #picks .none { padding: var(--sp-2) var(--sp-3); opacity: 0.7; }
      button {
        padding: var(--sp-2) var(--sp-4);
        font-size: var(--text-sm);
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        color: var(--role-button-fg);
        background: var(--role-button-bg);
      }
      button:hover:not(:disabled) { background: var(--role-button-hover-bg); }
      button.ghost {
        color: var(--vscode-button-secondaryForeground);
        background: var(--vscode-button-secondaryBackground);
      }
      button.ghost:hover:not(:disabled) { background: var(--vscode-button-secondaryHoverBackground); }
      button:disabled { opacity: 0.4; cursor: default; }

      #usage {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: var(--sp-1) var(--sp-foot-gap) 0;
        font-size: var(--text-xs);
        color: var(--role-secondary-fg);
        min-width: 0;
      }
      #usage .num { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
      #usage .pct { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
      #usage .track {
        flex: 1 1 0;
        min-width: 24px;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        background: color-mix(in srgb, var(--role-primary-fg) 20%, transparent);
      }
      #usage .used {
        display: block;
        height: 100%;
        background: var(--role-primary-fg);
        transition: width .3s ease-out;
      }

      #usage.warn .used { background: var(--role-again); }
      #usage.warn .pct { color: var(--role-again); }
      #usage.danger .used { background: var(--role-failed); }
      #usage.danger .pct { color: var(--role-failed); }

      #usage.unknown { opacity: .75; }

      #histat {
        padding: var(--sp-1) var(--sp-foot-gap) 0;
        font-size: var(--text-xs);
        color: var(--role-secondary-fg);
        font-variant-numeric: tabular-nums;
      }

      pre.cbhere {
        outline: 2px solid var(--role-focus);
        outline-offset: 2px;
      }

      .forkbtn {
        margin-left: var(--sp-2);
        padding: 0 var(--sp-2);
        font-size: var(--text-xs);
        font-family: inherit;
        color: var(--role-secondary-fg);
        background: transparent;
        border: 1px solid var(--role-border);
        border-radius: 3px;
        cursor: pointer;
        opacity: 0;
        transition: opacity .12s;
      }

      .msg:hover .forkbtn, .forkbtn:focus-visible { opacity: 1; }
      .forkbtn:hover { color: var(--role-primary-fg); border-color: var(--role-focus); }
    </style>
  </head>
  <body>
    <div id="head">
      <span id="where"></span>
      <span id="model"></span>
    </div>

    <div id="log">
      <div id="empty"></div>
    </div>

    <div id="todobar"></div>

    <div id="bar"></div>

    <script src="__BUNDLE__"></script>
    <script>
      const vscode = acquireVsCodeApi();

      const LOCALE = document.querySelector('meta[name="locale"]').content;
      const t = Bridge.makeTranslator(
        document.querySelector('meta[name="locale"]').content
      );

      Bridge.setFailedLabel(t('row.failed'));

      const { tell, ask, settleReply, unwrap } = Bridge.makeBridge((m) => vscode.postMessage(m));
      const proseOf = Bridge.proseOf;
      const log = document.getElementById('log');

      let stateEl = null;
      const whereEl = document.getElementById('where');
      const modelEl = document.getElementById('model');
      const emptyEl = document.getElementById('empty');
      const barEl = document.getElementById('bar');

      let input = null;

      whereEl.textContent = t('head.workspace', { path: t('head.workspace.none') });

      let landing = true;

      function drawEmpty() {
        Bridge.renderInto(
          emptyEl,

          Bridge.node(Bridge.ui.Empty, { lines: [t('empty.1')], after: null })
        );
      }

      drawEmpty();

      function setLanding() {
        landing = log.children.length === 0 || (log.children.length === 1 && log.firstElementChild === emptyEl);
        log.classList.toggle('landing', landing);

        drawBar();
      }

      let queued = [];
      let editingId = null;

      function queueProps() {
        return {
          items: queued,
          editingId,
          title: t('queue.title', { n: queued.length }),
          clearLabel: t('queue.clear'),
          hint: t('queue.hint'),
          removeTitle: t('queue.remove'),
          onClear: () => ask('queueClear').catch(() => {}),
          onEdit: (id) => {
            editingId = id;
            drawBar();
          },

          onSave: (id, text) => {
            if (editingId !== id) return;
            editingId = null;
            ask('queueUpdate', { id, text }).catch(() => {});
          },
          onCancel: () => {
            editingId = null;
            drawBar();
          },
          onRemove: (id) => ask('queueRemove', { id }).catch(() => {}),
        };
      }

      let mentionExists = {};
      let mentionAsked = '';

      function askMentions() {
        if (!input) return;
        const names = Bridge.parseMentions(input.value);
        const key = names.join('\u0000');
        if (key === mentionAsked) return;
        mentionAsked = key;
        if (!names.length) {
          mentionExists = {};
          return;
        }
        ask('mentionsExist', { names })
          .then((r) => {
            if (!r || !r.exists) return;
            mentionExists = r.exists;
            drawBar();
          })
          .catch(() => {});
      }

      function chipsProps() {
        return {
          names: input ? Bridge.parseMentions(input.value) : [],

          missing: mentionExists,
          missingTitle: t('chip.missing'),
          removeTitle: t('chip.remove'),
          onRemove: (name) => {

            input.value = input.value.split('@' + name).join('').replace(/[ \t]{2,}/g, ' ');
            grow();
            drawBar();
            input.focus();
          },
        };
      }

      let changeRows = [];
      let changesOpen = false;
      let changesEl = null;
      function drawChanges() {
        const items = Bridge.changedPaths(changeRows);
        if (changesEl && changesEl.isConnected) changesEl.remove();
        changesEl = null;
        if (!items.length) return;

        const node = Bridge.renderNode(
          Bridge.node(Bridge.ui.Changes, {
            items,
            title: t('changes.title'),
            open: changesOpen,
            onToggle: () => {
              changesOpen = !changesOpen;
              drawChanges();
            },

            onOpen: (p2) => ask('openPath', { path: p2, line: null }).catch(() => {}),
          }),
          'chgwrap'
        );

        if (!node || !node.firstElementChild) return;
        changesEl = node;
        log.appendChild(node);
        stick();
      }

      const pathKnown = new Map();

      function paintCode() {
        const blocks = [...log.querySelectorAll('pre[data-lang]:not([data-painted])')];
        if (!blocks.length) return;

        const kind = document.body.dataset.vscodeThemeKind || '';
        for (const pre of blocks) {
          pre.setAttribute('data-painted', '1');
          const codeEl = pre.querySelector('code');
          if (!codeEl) continue;
          const lang = pre.getAttribute('data-lang') || '';
          const src = codeEl.textContent || '';
          highlight(src, lang, kind)
            .then((html) => {
              if (!html) return;

              const tmp = document.createElement('div');
              tmp.innerHTML = html;
              const painted = tmp.querySelector('code');
              if (!painted) return;
              codeEl.innerHTML = painted.innerHTML;
              codeEl.classList.add('painted');

              const shikiPre = tmp.querySelector('pre');
              if (shikiPre && shikiPre.style.backgroundColor) {
                pre.style.backgroundColor = shikiPre.style.backgroundColor;
              }
            })
            .catch(() => {

            });
        }
      }

      function wirePaths() {
        const marks = [...log.querySelectorAll('code.maybepath:not([data-wired])')];
        if (!marks.length) return;
        const wanted = [];
        for (const e of marks) {
          e.setAttribute('data-wired', '1');

          const rel = String(e.getAttribute('data-path') || '').replace(/:\d+$/, '');
          if (!rel) continue;
          if (pathKnown.has(rel)) {
            if (pathKnown.get(rel)) e.classList.add('openable');
            continue;
          }
          wanted.push(rel);
        }
        if (!wanted.length) return;
        ask('mentionsExist', { names: [...new Set(wanted)] })
          .then((r) => {
            const found = (r && r.exists) || {};
            for (const [rel, ok] of Object.entries(found)) pathKnown.set(rel, !!ok);
            for (const e of log.querySelectorAll('code.maybepath')) {
              const rel = String(e.getAttribute('data-path') || '').replace(/:\d+$/, '');
              if (pathKnown.get(rel)) e.classList.add('openable');
            }
          })
          .catch(() => {});
      }

      log.addEventListener('click', (ev) => {
        const e = ev.target && ev.target.closest ? ev.target.closest('code.openable') : null;
        if (!e) return;
        const raw = String(e.getAttribute('data-path') || '');
        const m = /^(.*):(\d+)$/.exec(raw);
        ask('openPath', { path: m ? m[1] : raw, line: m ? Number(m[2]) : null }).catch(() => {});
      });

      function drawBar() {
        Bridge.renderInto(
          barEl,
          Bridge.node(Bridge.ui.Bar, {
            queue: queueProps(),
            picks: picksProps(),
            chips: chipsProps(),
            input: inputProps(),
            buttons: buttonProps(),

            usage: lastUsage ? { usage: lastUsage, t, short: shortNum } : null,

            historyAt: historyAtLabel,
          })
        );

        if (!input) input = document.getElementById('input');
        if (!stateEl) stateEl = document.getElementById('state');
      }

      let enterSends = true;

      let workspaceRoot = '';

      let mode = 'edit';

      let thinking = null;

      let thinkingWant = false;

      function setThinking(next) {
        thinking = next;
        thinkingWant = next;
        drawBar();
        ask('thinking', { on: next })
          .then((r) => {
            if (!r || typeof r.on !== 'boolean') return;
            thinkingWant = r.on;

            if (typeof thinking === 'boolean' && r.on !== thinking) {
              thinking = r.on;
              drawBar();
            }
          })
          .catch(() => {});
      }

      function cycleMode() {
        setMode(Bridge.nextMode(mode));
      }

      function setMode(next) {

        mode = next;
        drawBar();
        ask('mode', { mode: next })
          .then((r) => {

            if (r && r.mode && r.mode !== mode) {
              mode = r.mode;
              drawBar();
            }
          })
          .catch(() => {});
      }

      let lastUsage = null;

      let historyAtLabel = '';
      let historyAtTimer = null;
      let sent = [];
      let sentAt = -1;

      let draft = '';

      let cmdEl = null;
      let cmdTimer = null;
      let cmdCommand = '';
      let cmdOut = '';
      let cmdSince = 0;

      let cmdDone = null;
      function drawCmd() {
        if (!cmdEl) return;
        Bridge.renderInto(
          cmdEl,
          Bridge.node(Bridge.ui.Cmd, {
            command: cmdCommand,
            output: cmdOut,

            elapsed: Bridge.elapsedLabel(cmdSince, Date.now(), t),
            done: cmdDone,
          })
        );
      }

      let todoEl = null;

      function drawTodos(list) {
        const box = document.getElementById('todobar');
        if (!box) return;
        if (todoEl) {
          todoEl.remove();
          todoEl = null;
        }
        if (!Array.isArray(list) || !list.length) {
          box.classList.remove('has-todos');
          return;
        }
        todoEl = Bridge.renderNode(
          Bridge.node(Bridge.ui.Todos, { todos: list, title: t('todos.title') }),
          'todowrap'
        );
        box.appendChild(todoEl);
        box.classList.add('has-todos');
      }

      const subRows = new Map();
      function subProps(m) {
        return {
          at: m.at,
          name: m.name,
          state: m.state,
          stateKey: m.stateKey,
          turn: m.turn,
          of: m.of,
          chars: m.chars,
          turnLabel: m.turn ? t('sub.turn', { n: m.turn, of: m.of }) : '',
          charsLabel: m.chars ? t('sub.chars', { n: m.chars }) : '',
        };
      }

      let running = false;

      let streamEl = null;

      let lastProse = '';

      function atBottom() {
        return Bridge.isAtBottom(log.scrollTop, log.clientHeight, log.scrollHeight);
      }

      function addCodeActions(root) {
        for (const pre of root.querySelectorAll('pre')) {
          if (pre.dataset.acts) continue;

          if (pre.closest('.toolbox')) continue;
          pre.dataset.acts = '1';
          const bar = document.createElement('div');
          bar.className = 'cbacts';
          for (const [act, label] of [
            ['copy', t('cb.copy')],
            ['cursor', t('cb.cursor')],
            ['newfile', t('cb.newfile')],
            ['terminal', t('cb.terminal')],
          ]) {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'cbact';
            b.textContent = label;
            b.addEventListener('click', () => {
              const code = pre.querySelector('code');
              tell('codeblock', { action: act, text: code ? code.textContent : pre.textContent });
            });
            bar.appendChild(b);
          }
          pre.appendChild(bar);
        }
      }

      let cbAt = -1;
      function codeBlocks() {

        return [...log.querySelectorAll('pre')].filter((p) => !p.closest('.toolbox'));
      }
      function gotoCodeBlock(dir) {
        const all = codeBlocks();
        if (!all.length) {
          setState(t('cb.none'));
          setTimeout(() => setState(''), 1600);
          return;
        }

        cbAt = cbAt < 0 ? (dir > 0 ? 0 : all.length - 1) : cbAt + dir;

        cbAt = Math.max(0, Math.min(all.length - 1, cbAt));
        for (const p of all) p.classList.remove('cbhere');

        const here = all[cbAt];
        here.classList.add('cbhere');
        here.scrollIntoView({ block: 'center', behavior: 'smooth' });

        historyAtLabel = t('cb.at', { n: String(cbAt + 1), of: String(all.length) });
        drawBar();
        if (historyAtTimer) clearTimeout(historyAtTimer);
        historyAtTimer = setTimeout(() => {
          historyAtLabel = '';
          historyAtTimer = null;
          drawBar();
        }, 2000);
      }

      let run = null;

      const isSeeThrough = (n) =>
        !!(n && n.classList && (n.classList.contains('note') || n.classList.contains('chgwrap')));

      function runReset() {
        run = null;
      }

      function placeTool(el, name, ok, target, sub) {

        const subLabel = sub ? t('sub.name', { n: String(sub) }) : '';
        if (sub) name = subLabel;
        const stick = atBottom();
        if (emptyEl && emptyEl.parentNode) emptyEl.remove();

        const seeThrough = isSeeThrough;
        let tail = log.lastChild;
        while (seeThrough(tail)) tail = tail.previousSibling;
        if (run && (run.name !== name || !run.el.isConnected || tail !== run.el)) {
          runReset();
        }
        if (run) {
          run.n += 1;
          if (target) run.tgts.push(String(target));
          if (!ok) run.bad = true;
          run.body.appendChild(el);
          run.el.className =
            'toolrun' + (run.el.classList.contains('open') ? ' open' : '') + (run.bad ? ' bad' : '');
          run.head.querySelector('.n').textContent = t('tool.run', { name, n: String(run.n) });
          run.head.querySelector('.tgts').textContent = run.tgts.slice(-4).join(' / ');
        } else {

          let prev = log.lastChild;
          while (seeThrough(prev)) prev = prev.previousSibling;
          if (prev && prev.dataset && prev.dataset.tool === name) {

            const box = document.createElement('div');
            box.className = 'toolrun';
            const head = document.createElement('div');
            head.className = 'runhead';
            head.innerHTML = '<span class="caret">▸</span><span class="n"></span><span class="tgts"></span>';
            const body = document.createElement('div');
            body.className = 'runbody';
            box.appendChild(head);
            box.appendChild(body);
            head.addEventListener('click', () => {
              box.classList.toggle('open');
              head.querySelector('.caret').textContent = box.classList.contains('open') ? '▾' : '▸';
            });
            log.replaceChild(box, prev);
            body.appendChild(prev);
            body.appendChild(el);
            run = {
              el: box,
              head,
              body,
              name,
              n: 2,
              tgts: [prev.dataset.tgt || '', String(target || '')].filter(Boolean),
              bad: prev.dataset.bad === '1' || !ok,
            };
            if (run.bad) box.classList.add('bad');
            head.querySelector('.n').textContent = t('tool.run', { name, n: '2' });
            head.querySelector('.tgts').textContent = run.tgts.slice(-4).join(' / ');
          } else {
            el.dataset.tool = name;
            el.dataset.tgt = String(target || '');
            el.dataset.bad = ok ? '0' : '1';
            log.appendChild(el);
          }
        }
        try {
          addCodeActions(el);

          wirePaths();

          paintCode();

          drawChanges();
        } catch {

        }
        setLanding();
        if (stick) log.scrollTop = log.scrollHeight;
        return el;
      }

      function place(el) {
        const stick = atBottom();
        if (emptyEl && emptyEl.parentNode) emptyEl.remove();

        if (!isSeeThrough(el)) runReset();
        log.appendChild(el);

        try {
          addCodeActions(el);

          wirePaths();

          paintCode();
        } catch {

        }

        setLanding();
        if (stick) log.scrollTop = log.scrollHeight;
        return el;
      }

      const esc = Bridge.esc;
      const render = Bridge.render;

      const highlight = Bridge.highlight;

      const tookLabel = (ms) => Bridge.tookLabel(ms, t);

      let sentTurns = [];

      function addMsg(cls, who, content, asText, took) {

        let onFork = null;
        if (cls === 'you') {
          const idx = sentTurns.length;
          sentTurns.push(String(content == null ? '' : content));
          if (idx > 0) {
            onFork = () => tell('fork', { at: idx, upto: sentTurns.slice(0, idx) });
            onFork.label = t('fork.label');
            onFork.title = t('fork.title');
          }
        }
        return place(
          Bridge.renderNode(
            Bridge.node(Bridge.ui.Msg, { cls, who, content, asText, took, onFork }),
            'msg ' + cls
          )
        );
      }

      function setRunning(v) {
        running = v;
        drawBar();
        if (!v) {
          setState('');
          input.focus();
        }
      }

      function buttonProps() {
        return {

          sendLabel: t('btn.send'),
          sendHint: running ? t('btn.queue') : t('btn.send'),
          stopLabel: t('btn.stop'),
          canStop: running,
          onSend: send,
          onStop: () => {
            setState(t('state.cancelling'));
            tell('cancel');
          },

          mode: {
            mode,

            label: t("mode." + mode),

            labels: Object.fromEntries(Bridge.modeOrder.map((m) => [m, t("mode." + m)])),

            notes: Object.fromEntries(Bridge.modeOrder.map((m) => [m, t('mode.' + m + '.d')])),
            hint: t('mode.hint', { how: 'Shift+Tab' }),
            onPick: setMode,

            thinking,
            thinkingLabel: t('mode.thinking'),
            thinkingNote: t('mode.thinking.d'),
            onThinking: setThinking,
          },

          addContext: {
            hint: t('ctx.add'),

            onAdd: () => {

              pickForced = true;
              pickFrom = input.selectionStart;
              pickKind = 'file';
              input.focus();
              refreshPicks();
            },
          },
          enter: {
            enterSends,
            labels: { send: t('enter.sends'), newline: t('enter.newline') },
            hint: t('enter.hint'),
            onToggle: () => {
              const next = !enterSends;
              enterSends = next;
              drawBar();
              ask('keys', { enterSends: next }).catch(() => {});
            },
          },
        };
      }

      function showHistoryAt() {
        if (historyAtTimer) {
          clearTimeout(historyAtTimer);
          historyAtTimer = null;
        }
        if (sentAt < 0) {

          historyAtLabel = '';
          drawBar();
          return;
        }
        historyAtLabel = t('history.at', {
          n: String(sentAt + 1),
          of: String(sent.length),
        });
        drawBar();
        historyAtTimer = setTimeout(() => {
          historyAtLabel = '';
          historyAtTimer = null;
          drawBar();
        }, 2000);
      }

      let sendingSince = 0;

      const NO_REPLY_SEC = 25;

      let stateText = '';
      let stateSince = null;
      let stateCounts = null;
      let stateTimer = null;

      const shortNum = Bridge.shortNum;

      const elapsedLabel = () => Bridge.elapsedLabel(stateSince, Date.now(), t);

      function drawState() {

        if (sendingSince && Date.now() - sendingSince > NO_REPLY_SEC * 1000) {
          sendingSince = 0;
          stateText = t('state.noReply');
        }
        Bridge.renderInto(
          stateEl,
          Bridge.node(Bridge.ui.State, {
            text: stateText,
            verb: stateVerb,
            elapsed: elapsedLabel(),
            counts: stateCounts,
          })
        );
      }

      let stateVerb = '';

      function setState(text, extra) {

        if (text !== t('state.sending')) sendingSince = 0;
        stateText = text;
        if (extra && extra.startedAt) stateSince = extra.startedAt;

        if (extra && extra.turn) stateVerb = Bridge.verbFor(extra.turn, LOCALE);
        if (extra && (extra.tools || extra.wrote || extra.got)) {

          stateCounts = t('state.counts', {
            got: shortNum(extra.got || 0),
            tools: extra.tools || 0,
            wrote: extra.wrote || 0,
          });
        }
        if (!text) {

          stateSince = null;
          stateCounts = null;
          if (stateTimer) {
            clearInterval(stateTimer);
            stateTimer = null;
          }
        } else if (stateSince && !stateTimer) {
          stateTimer = setInterval(drawState, 1000);
        }
        drawState();
      }

      function grow() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 200) + 'px';
      }

      function send({ fresh = false } = {}) {
        const task = input.value.trim();

        if (!task) return;

        if (sent[0] !== task) sent.unshift(task);
        if (sent.length > 100) sent.length = 100;
        sentAt = -1;
        draft = '';
        input.value = '';
        grow();
        drawBar();

        const bang = Bridge.splitBang(task);
        if (bang.bang) {
          addMsg('you', t('role.you'), task, true);
          setRunning(true);
          setState(t('bang.running', { command: bang.command }));
          tell('bang', { command: bang.command });
          return;
        }
        if (running) {

          tell('run', { task });
          return;
        }
        addMsg('you', t('role.you'), task, true);
        setRunning(true);

        sendingSince = Date.now();
        setState(t('state.sending'), { startedAt: sendingSince });

        if (fresh) tell('runFresh', { task });
        else tell('run', { task });
      }

      let composing = false;

      function inputProps() {
        return {
          ref: (el) => {
            if (el) input = el;
          },

          placeholder: (() => {
            const key = landing ? 'input.placeholder' : 'input.placeholder.more';
            if (enterSends) return t(key);

            return t(key + '.nl', { send: t('enter.sendKey') });
          })(),
          onInput: () => {
            grow();
            drawBar();
            refreshPicks();

            askMentions();
          },
          onKeyDown: onInputKey,

          onBlur: () => setTimeout(closePicks, 100),
          onCompositionStart: () => {
            composing = true;
          },
          onCompositionEnd: () => {
            composing = false;
          },

          onDragOver: (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            markDrop(true);
          },
          onDragLeave: (e) => {

            const r = e.currentTarget.getBoundingClientRect();
            if (
              e.clientX <= r.left ||
              e.clientX >= r.right ||
              e.clientY <= r.top ||
              e.clientY >= r.bottom
            ) {
              markDrop(false);
            }
          },
          onDrop: (e) => {
            e.preventDefault();
            markDrop(false);

            const raw =
              e.dataTransfer.getData('text') ||
              e.dataTransfer.getData('application/vnd.code.uri-list') ||
              e.dataTransfer.getData('text/uri-list');
            const ats = Bridge.dropToMentions(raw, workspaceRoot);
            if (!ats.length) return;
            const at = input.selectionStart;
            const before = input.value.slice(0, at);
            const after = input.value.slice(input.selectionEnd);
            const sep = before && !/\s$/.test(before) ? ' ' : '';
            const text = ats.join(' ') + ' ';
            setInput(before + sep + text + after, 'end');
            input.focus();
            const pos = (before + sep + text).length;
            input.setSelectionRange(pos, pos);
            input.dispatchEvent(new Event('input', { bubbles: true }));
          },
        };
      }

      let picks = [];
      let pickAt = -1;
      let pickFrom = -1;
      let pickKind = 'file';

      let pickForced = false;

      let builtinNames = [];
      let pickTimer = null;
      let pickSeq = 0;

      let picksOpen = false;

      function closePicks() {
        picks = [];
        pickAt = -1;
        pickFrom = -1;
        picksOpen = false;
        pickForced = false;
        drawBar();
      }

      function picksProps() {
        return {
          items: picks,
          at: pickAt,
          hidden: !picksOpen,
          noneLabel: t('picks.none'),
          onChoose: choosePick,
        };
      }

      function mentionAtCaret() {
        return Bridge.mentionAt(input.value, input.selectionStart);
      }

      function refreshPicks() {

        const typed = pickForced ? input.value.slice(pickFrom, input.selectionStart) : '';
        const here = pickForced
          ? (input.selectionStart >= pickFrom && !/\s/.test(typed)
              ? { from: pickFrom, kind: 'file', query: typed }
              : null)
          : mentionAtCaret();
        if (!here) {
          closePicks();
          return;
        }
        pickFrom = here.from;
        pickKind = here.kind;
        const mine = (pickSeq += 1);
        clearTimeout(pickTimer);

        pickTimer = setTimeout(() => {

          (here.kind === 'skill' ? ask('skills', { query: here.query }) : ask('files', { query: here.query }))
            .then((r) => {

              if (mine !== pickSeq) return;
              if (!pickForced && !mentionAtCaret()) return;
              picks = (r && r.items) || [];
              builtinNames = (r && r.builtin) || [];
              pickAt = picks.length ? 0 : -1;
              picksOpen = true;
              drawBar();
            })
            .catch(() => closePicks());
        }, 120);
      }

      function choosePick(i) {
        if (i < 0 || i >= picks.length || pickFrom < 0) return;
        let p = picks[i];

        if (pickKind === 'skill' && builtinNames.includes(p)) {
          closePicks();
          input.value = '';
          grow();
          drawBar();
          ask('runCommand', { name: p }).catch(() => {});
          return;
        }
        const mark = pickKind === 'skill' ? '/' : '@';
        if (pickKind !== 'skill' && /\s/.test(p)) p = '"' + p + '"';
        const at = input.selectionStart;
        const before = input.value.slice(0, pickFrom);

        const gap = pickForced && before && !/\s$/.test(before) ? ' ' : '';
        const next = before + gap + mark + p + ' ' + input.value.slice(at);
        const caret = pickFrom + gap.length + 1 + p.length + 1;
        input.value = next;
        input.setSelectionRange(caret, caret);
        closePicks();
        grow();
        input.focus();
      }

      function onInputKey(e) {

        const ne = e.nativeEvent || e;
        const what = Bridge.decideKey(ne, {
          composing,
          picksOpen,
          pickCount: picks.length,
          pickAt,

          hasSelection: input.selectionStart !== input.selectionEnd,
          atStart: input.selectionStart === 0 && input.selectionEnd === 0,
          atEnd:
            input.selectionStart === input.value.length &&
            input.selectionEnd === input.value.length,
          inHistory: sentAt >= 0,

          enterSends,
        });
        if (what === 'pass') return;
        e.preventDefault();
        if (what === 'move-down' || what === 'move-up') {
          pickAt = Bridge.moveIndex(pickAt, picks.length, what === 'move-down' ? 1 : -1);
          drawBar();
          return;
        }
        if (what === 'close') {
          closePicks();
          return;
        }
        if (what === 'cycle-mode') {
          cycleMode();
          return;
        }
        if (what === 'choose') {
          choosePick(pickAt);
          return;
        }
        if (what === 'history-prev') {
          if (!sent.length) return;

          if (sentAt < 0) draft = input.value;
          sentAt = Math.min(sentAt + 1, sent.length - 1);
          setInput(sent[sentAt], 'start');
          showHistoryAt();
          return;
        }
        if (what === 'history-next') {
          if (sentAt <= 0) {

            sentAt = -1;
            setInput(draft, 'end');
            showHistoryAt();
            return;
          }
          sentAt -= 1;
          setInput(sent[sentAt], 'end');
          showHistoryAt();
          return;
        }
        if (what === 'send-fresh') {
          closePicks();
          send({ fresh: true });
          return;
        }
        if (what === 'send') {
          closePicks();

          send();
        }
      }

      function markDrop(on) {
        const box = document.getElementById('inwrap');
        if (box) box.classList.toggle('dropping', !!on);
      }

      function setInput(text, where) {
        input.value = String(text || '');
        grow();
        drawBar();
        const at = where === 'end' ? input.value.length : 0;
        input.setSelectionRange(at, at);
        input.focus();
      }

      window.addEventListener('message', (ev) => {
        const env = ev.data;
        if (settleReply(env)) return;
        const m = unwrap(env);
        if (m.type === 'model') {

          modelEl.textContent = m.text || '';
          modelEl.title = m.text || '';
        } else if (m.type === 'prefill') {

          setInput(String(m.text || ''), 'end');
          input.focus();
          grow();
        } else if (m.type === 'codeblocknav') {

          gotoCodeBlock(m.dir === 'prev' ? -1 : 1);
        } else if (m.type === 'clearhistory') {

          sent = [];
          sentAt = -1;
        } else if (m.type === 'submit') {

          send({});
        } else if (m.type === 'blur') {

          const el = document.getElementById('input');
          if (el && el.blur) el.blur();
        } else if (m.type === 'focusview') {

          document.body.classList.toggle('focus', !!m.on);
        } else if (m.type === 'where') {

          whereEl.textContent = t('head.workspace', {
            path: m.text || t('head.workspace.none'),
          });
          whereEl.title = m.text || '';

          workspaceRoot = String(m.text || "");
        } else if (m.type === 'turn') {
          setState(m.label, m);

          if (m.usage) {
            lastUsage = m.usage;
            drawBar();
          }

          streamEl = null;
        } else if (m.type === 'queue') {

          if (sendingSince) setState('');
          queued = Array.isArray(m.items) ? m.items : [];

          if (editingId && !queued.some((x) => x.id === editingId)) editingId = null;
          drawBar();
        } else if (m.type === 'image') {

          place(
            Bridge.renderNode(
              Bridge.node(Bridge.ui.Shot, {
                dataUrl: m.dataUrl,
                width: m.width,
                height: m.height,
                cap: t('image.cap', {
                  w: m.width || '?',
                  h: m.height || '?',
                  kb: Math.round((m.bytes || 0) / 1024),
                }),

                failed: t('image.failed', { why: m.error || '' }),
              }),
              m.dataUrl ? 'shot' : 'note'
            )
          );
        } else if (m.type === 'busy') {

          setState(t('state.busy', { label: m.label || '' }));
        } else if (m.type === 'delta') {
          setState(t('state.delta', { label: m.label, n: m.text.length }));
          const prose = proseOf(m.text, true);
          if (prose) {
            if (!streamEl) streamEl = addMsg('agent', 'ChatGPT', '', false);

            const stick = atBottom();

            Bridge.renderInto(
              streamEl,
              Bridge.node(Bridge.ui.Msg, {
                cls: 'agent',
                who: 'ChatGPT',
                content: render(prose),
                asText: false,
              })
            );
            if (stick) log.scrollTop = log.scrollHeight;
          }
        } else if (m.type === 'answer') {
          const prose = proseOf(m.text, false);
          if (streamEl) {

            if (prose) {
              Bridge.renderInto(
                streamEl,
                Bridge.node(Bridge.ui.Msg, {
                  cls: 'agent',
                  who: 'ChatGPT',
                  content: render(prose),
                  asText: false,
                  took: tookLabel(m.ms),
                })
              );
            } else {
              streamEl.remove();
            }
            streamEl = null;
          } else if (prose) {
            addMsg('agent', 'ChatGPT', render(prose), false, tookLabel(m.ms));
          }
          lastProse = prose;
        } else if (m.type === 'tool') {

          changeRows.push({ name: m.name, target: m.target, ok: m.ok });

          if (cmdEl && cmdEl.isConnected && m.name === 'run_command') {
            cmdEl.remove();
            cmdEl = null;

            if (cmdTimer) {
              clearInterval(cmdTimer);
              cmdTimer = null;
            }
          }

          const clipped =
            m.fullLength && m.output && m.fullLength > m.output.length
              ? t('tool.clipped', { n: m.fullLength })
              : '';
          const diff = m.diffKey ? { label: m.newFile ? t('tool.open') : t('tool.diff') } : null;

          placeTool(
            Bridge.renderNode(
                Bridge.node(Bridge.ui.Tool, {
                  state: m.state,
                  ok: m.ok,
                  name: m.name,
                  target: m.target,
                  why: m.why,
                  output: m.output,
                  clipped,
                  took: tookLabel(m.ms),

                  more:
                    m.fullLines && m.id
                      ? {
                          label: t('tool.more', { n: m.fullLines }),
                          onOpen: () => ask('output', { id: m.id }).catch((e) => ({ why: e.message })),
                        }
                      : null,
                  diff,

                  onOpenDiff: async () => {
                    try {
                      const r = await ask('showdiff', {
                        diffKey: m.diffKey,
                        target: m.target,
                        newFile: m.newFile,
                      });

                      if (!r || !r.opened) return { text: t('tool.cantOpen') };
                      return { text: diff.label };
                    } catch (e) {
                      return { text: t('tool.cantOpen'), why: e.message };
                    }
                  },
                })
            ),

            m.name,
            m.ok,
            m.target,

            m.sub || null
          );
        } else if (m.type === 'ask') {

          place(
            Bridge.renderNode(
              Bridge.node(Bridge.ui.Ask, {
                text: m.text,
                detail: m.detail,
                kind: m.kind,
                actions: m.actions || [],

                answered: m.answered,
                cantStart: t('ask.cantStart'),
                onRun: async (a) => {
                  try {

                    if (a.action === 'askrun') return await ask('askrun', { answer: a.answer });
                    if (a.action === 'moreturns') return await ask('moreturns', { answer: a.answer });

                    if (a.action === 'failing') return await ask('failing', { answer: a.answer });

                    if (a.action === 'silent') return await ask('silent', { answer: a.answer });

                    if (a.action === 'todosopen') return await ask('todosopen', { answer: a.answer });

                    if (a.action === 'downgrade') return await ask('downgrade', { answer: a.answer });

                    if (a.action === 'choice') return await ask('choice', { answer: a.answer });
                    if (a.action === 'gitinit') return await ask('gitinit');
                    if (a.action === 'newconv') return await ask('newconv');
                    if (a.action === 'usethis') return await ask('usethis');
                    return { started: false, why: t('ask.unknownAction', { action: a.action }) };
                  } catch (e) {
                    return { started: false, why: e.message };
                  }
                },
              }),
              'ask'
            )
          );
        } else if (m.type === 'cmdout') {

          if (!cmdEl || !cmdEl.isConnected) {

            cmdEl = document.createElement('div');
            cmdEl.className = 'cmdout';
            cmdCommand = m.command || '';
            cmdOut = '';
            cmdSince = Date.now();
            cmdDone = null;
            place(cmdEl);
            drawCmd();

            cmdTimer = setInterval(() => {
              if (!cmdEl || !cmdEl.isConnected) return;
              drawCmd();
            }, 1000);
          }
          cmdOut += m.chunk || '';
          drawCmd();
        } else if (m.type === 'todos') {
          drawTodos(m.todos || []);
        } else if (m.type === 'bangDone') {

          if (cmdTimer) {
            clearInterval(cmdTimer);
            cmdTimer = null;
          }
          if (cmdEl && cmdEl.isConnected) {

            cmdDone = { ok: m.code === 0, label: t('bang.done', { command: '', code: m.code }).trim() };
            drawCmd();

            cmdEl = null;
          }

          setRunning(false);
          if (m.pending > 0) setState(t('bang.pending', { n: m.pending }));
        } else if (m.type === 'sub') {

          const key = String(m.key || '');
          let host = subRows.get(key);

          if (host && !host.isConnected) {
            subRows.delete(key);
            host = null;
          }
          if (!host) {
            host = Bridge.renderNode(
              Bridge.node(Bridge.ui.Sub, subProps(m)),
              'subrow'
            );
            subRows.set(key, host);
            place(host);
          } else {
            Bridge.renderInto(host, Bridge.node(Bridge.ui.Sub, subProps(m)));
          }
        } else if (m.type === 'insert') {

          const at = input.selectionStart;
          const before = input.value.slice(0, at);
          const after = input.value.slice(input.selectionEnd);

          const sep = before && !/\s$/.test(before) ? ' ' : '';

          const tail = after && !/^\s/.test(after) ? ' ' : '';
          setInput(before + sep + m.text + tail + after, 'end');
          input.focus();
          input.setSelectionRange(
            (before + sep + m.text).length,
            (before + sep + m.text).length
          );
          input.dispatchEvent(new Event('input', { bubbles: true }));
        } else if (m.type === 'thinking') {

          const next = typeof m.on === 'boolean' ? thinkingWant : null;
          if (next !== thinking) {
            thinking = next;
            drawBar();
          }
        } else if (m.type === 'note') {

          place(Bridge.renderNode(Bridge.node(Bridge.ui.Note, { text: m.text }), 'note'));
        } else if (m.type === 'result') {
          setRunning(false);
          streamEl = null;
          const okish = m.status === 'done' || m.status === 'answered' || m.status === 'asked';

          const capKey =
            m.status === 'done'
              ? 'result.done'
              : m.status === 'answered'
                ? 'result.answered'
                : m.status === 'asked'
                  ? 'result.asked'
                  : 'result.stopped';

          const detail = String(m.detail || '').trim();

          const detailHtml = Bridge.shouldShowDetail(detail, lastProse, m.tools || 0)
            ? render(detail)
            : '';

          const actions = m.sha
            ? [
                {
                  key: 'diff',
                  label: t('result.seeDiff'),
                  run: async () => {
                    try {
                      const r = await ask('diff', { sha: m.sha });
                      if (!r || !r.opened) return { text: t('result.cantShow') };
                      return { text: t('result.seeDiff') };
                    } catch (e) {
                      return { text: t('result.cantShow'), why: e.message };
                    }
                  },
                },
                {
                  key: 'revert',
                  label: t('result.revert'),

                  run: async () => {
                    try {
                      const r = await ask('revert', { sha: m.sha });
                      return {
                        text: t(r && r.reverted ? 'result.reverted' : 'result.revert'),
                        keepOff: !!(r && r.reverted),
                        why: r && r.why ? r.why : '',
                      };
                    } catch (e) {
                      return { text: t('result.cantRevert'), why: e.message };
                    }
                  },
                },
              ]
            : [];
          place(
            Bridge.renderNode(
              Bridge.node(Bridge.ui.Result, { okish, cap: [
                  t(capKey),

                  m.tools ? t('result.tools', { n: m.tools }) : '',
                  m.wrote ? t('result.wrote', { n: m.wrote }) : '',
                  m.ms ? tookLabel(m.ms) : '',
                ].filter(Boolean).join(' · '), detailHtml, actions }),
              'result' + (okish ? '' : ' bad')
            )
          );
        } else if (m.type === 'fresh') {

          log.innerHTML = '';
          subRows.clear();
          streamEl = null;

          drawTodos([]);

          changeRows = [];
          changesOpen = false;
          changesEl = null;
          if (emptyEl) log.appendChild(emptyEl);
          setLanding();

        } else if (m.type === 'idle') {

          setRunning(false);
        } else if (m.type === 'clear') {
          log.innerHTML = '';
          subRows.clear();

          runReset();
          streamEl = null;
          sentTurns = [];

          cbAt = -1;

          drawTodos([]);
          if (emptyEl) log.appendChild(emptyEl);
          setLanding();
        } else if (m.type === 'you') {

          addMsg('you', t('role.you'), m.text, true);
        } else if (m.type === 'restored') {

          place(Bridge.renderNode(Bridge.node(Bridge.ui.Note, { text: t('restored.mark') }), 'note'));
          log.scrollTop = log.scrollHeight;
        } else if (m.type === 'error') {
          setRunning(false);
          streamEl = null;
          addMsg('agent', t('role.error'), m.text, true);
        }
      });

      drawBar();
      setLanding();

      ask('keys', {})
        .then((r) => {
          if (r && typeof r.enterSends === 'boolean') {
            enterSends = r.enterSends;
            drawBar();
          }
        })
        .catch(() => {});
      ask('mode', {})
        .then((r) => {
          if (r && r.mode) {
            mode = r.mode;
            drawBar();
          }
        })
        .catch(() => {});

      ask('thinking', {})
        .then((r) => {
          if (r && typeof r.on === 'boolean') {
            thinkingWant = r.on;
            if (typeof thinking === 'boolean' && thinking !== r.on) {
              thinking = r.on;
              drawBar();
            }
          }
        })
        .catch(() => {});
      ask('history')
        .then((r) => {
          sent = (r && r.items) || [];
        })
        .catch(() => {});
      tell('ready');
      grow();
      input.focus();
    </script>
  </body>
</html>
